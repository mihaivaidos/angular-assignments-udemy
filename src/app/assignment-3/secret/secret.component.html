<button class="btn btn-primary" (click)="onDisplay()">Display Details</button>

@if (showContent()) {
  <p>Secret content that should appear and disappear when clicking the button.</p>
}
@for (logItem of log(); track $index) {
  <p
    [ngStyle]="{backgroundColor: $index >= 4 ? 'blue' : 'transparent'}"
    [ngClass]="{'log-text': $index >= 4}"
  >{{ logItem }}
  </p>
}
